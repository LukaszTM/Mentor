name: Build Mentor.exe

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Zainstaluj PyInstaller
        run: pip install pyinstaller==6.11.1
      - name: Zbuduj programy (ze źródeł, dla pewności)
        run: |
          python programy/zrodla/python_junior_qa/zbuduj.py
          python programy/zrodla/kadry_i_place/zbuduj.py
          python programy/zrodla/kadry_i_place/materialy.py
          python programy/zrodla/vibe_coding/zbuduj.py
          python programy/zrodla/vibe_coding/materialy.py
      - name: Test importu i walidacji programu
        run: python -c "import program; [print(f, program.wczytaj(f) or 'OK') for f in ('programy/python-junior-qa.json', 'programy/kadry-i-place.json', 'programy/vibe-coding.json')]"
      - name: Test paczki materiałów (STANDARD §10 — import, pliki, sumy kontrolne)
        run: |
          python programy/materialy/kadry-i-place/testy/sprawdz_kurs.py
          python programy/materialy/vibe-coding/testy/sprawdz_kurs.py
      - name: Testy pytest (ZIP, środowiska, instalacja .venv z locka, testy końcowe z Edge, ćwiczenia, GUI)
        shell: pwsh
        env:
          MENTOR_DANE: ${{ runner.temp }}\mentor-dane
          MENTOR_PRACA: ${{ runner.temp }}\mentor-praca
        run: |
          pip install pytest==9.2.0
          python -m pytest testy -q -p no:cacheprovider --durations=10
      - name: PyInstaller
        run: pyinstaller --clean --noconfirm mentor.spec
      - name: Test uruchomienia exe (smoke)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist\Mentor.exe" -PassThru
          Start-Sleep -Seconds 8
          if ($p.HasExited) { Write-Error "Mentor.exe zakonczyl sie z kodem $($p.ExitCode)"; exit 1 }
          Stop-Process -Id $p.Id -Force
          Write-Host "Mentor.exe uruchamia sie poprawnie"
      - name: Spakuj
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path pakiet\Mentor | Out-Null
          Copy-Item dist\Mentor.exe pakiet\Mentor\
          Copy-Item README.md pakiet\Mentor\
          # Mentor bez dodatkowych kursów: tylko domyślny program, szablon, opis formatu i lock zależności.
          # Kursy (Kadry i płace, Vibe coding) są osobnymi paczkami ZIP — uczeń wgrywa je sam: Ustawienia → Importuj kurs ZIP…
          New-Item -ItemType Directory -Path pakiet\Mentor\programy | Out-Null
          foreach ($f in @("python-junior-qa.json", "szablon-programu.json", "FORMAT.md", "STANDARD_KURSOW.md")) { Copy-Item "programy\$f" pakiet\Mentor\programy\ }
          Copy-Item -Recurse programy\zaleznosci pakiet\Mentor\programy\zaleznosci
          Compress-Archive -Path pakiet\Mentor -DestinationPath Mentor-windows.zip
          # osobne paczki kursów do importu w Mentorze
          New-Item -ItemType Directory -Path pakiet\kurs | Out-Null
          Copy-Item -Recurse programy\materialy\kadry-i-place pakiet\kurs\Kadry-i-place
          Copy-Item -Recurse programy\materialy\vibe-coding pakiet\kurs\Vibe-coding
          Get-ChildItem -Recurse -Directory -Filter __pycache__ pakiet\kurs | Remove-Item -Recurse -Force -ErrorAction SilentlyContinue
          Compress-Archive -Path pakiet\kurs\Kadry-i-place -DestinationPath Kadry-i-place-kurs.zip
          Compress-Archive -Path pakiet\kurs\Vibe-coding -DestinationPath Vibe-coding-kurs.zip
      - name: Sprawdź paczki (Mentor bez kursów, import ZIP kursów)
        shell: pwsh
        run: python programy/zrodla/sprawdz_paczki.py Mentor-windows.zip Kadry-i-place-kurs.zip Vibe-coding-kurs.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Mentor-windows
          path: |
            dist/Mentor.exe
            Mentor-windows.zip
            Kadry-i-place-kurs.zip
            Vibe-coding-kurs.zip
      - name: Release (najnowsza wersja)
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'latest' }}
          name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'Mentor — najnowsza wersja' }}
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/v') }}
          body: |
            **Mentor.exe** — interaktywny nauczyciel (Windows 10/11, 64-bit, bez instalacji).

            Pobierz **`Mentor-windows.zip`** (zalecane: exe + README + domyślny program „Python od zera → Junior QA”)
            albo `Mentor.exe` (sam program).

            **Kursy są osobnymi paczkami — nie są wbudowane w Mentora.** Pobierz wybrany kurs i wgraj go w Mentorze:
            Ustawienia → Program nauczania → **📦 Importuj kurs ZIP…** (podgląd przed importem, skryptów z paczki Mentor nie uruchamia).
            - `Kadry-i-place-kurs.zip` — „Kadry i płace — kurs zaawansowany (praktyka 2026)”, 16 tygodni.
            - `Vibe-coding-kurs.zip` — „Vibe coding od podstaw”, 16 tygodni (Claude Code + Codex): materiały, niezależne testy zadań (WERYFIKATORY), rozwiązania wzorcowe.

            **Nowe (2.9.1):** kursy nie są już wbudowane w Mentora — każdy kurs wgrywasz sam z paczki ZIP. Kursy zaimportowane wcześniej i postępy zostają.

            Windows SmartScreen może ostrzec przy pierwszym uruchomieniu (plik bez podpisu): „Więcej informacji” → „Uruchom mimo to”.

            **Nowe (2.7):** zakładka **Środowisko** — Mentor sam sprawdza i instaluje Pythona, biblioteki i środowisko kursu (bez terminala, bez
            uprawnień administratora, za Twoją zgodą), **Importuj kurs ZIP…** w Ustawieniach (podgląd, bezpieczne rozpakowanie, stare paczki v1.1 bez
            uruchamiania skryptów), ćwiczenia uruchamiane i sprawdzane **w Mentorze**. Dane (postępy, kursy, środowiska) są w `%LOCALAPPDATA%\Mentor\`;
            stary `mentor_dane.json` obok exe przenosi się sam (z kopią). `portable.txt` obok exe = tryb przenośny.
          files: |
            dist/Mentor.exe
            Mentor-windows.zip
            Kadry-i-place-kurs.zip
            Vibe-coding-kurs.zip
