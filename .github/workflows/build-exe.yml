name: Build Mentor.exe

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Zainstaluj PyInstaller
        run: pip install pyinstaller==6.11.1
      - name: Zbuduj programy (ze źródeł, dla pewności)
        run: |
          python programy/zrodla/python_junior_qa/zbuduj.py
          python programy/zrodla/kadry_i_place/zbuduj.py
          python programy/zrodla/kadry_i_place/materialy.py
      - name: Test importu i walidacji programu
        run: python -c "import program; [print(f, program.wczytaj(f) or 'OK') for f in ('programy/python-junior-qa.json', 'programy/kadry-i-place.json')]"
      - name: Test paczki materiałów (STANDARD §10 — import, pliki, sumy kontrolne)
        run: python programy/materialy/kadry-i-place/testy/sprawdz_kurs.py
      - name: Testy pytest (ZIP, środowiska, instalacja .venv z locka, testy końcowe z Edge, ćwiczenia, GUI)
        shell: pwsh
        env:
          MENTOR_DANE: ${{ runner.temp }}\mentor-dane
          MENTOR_PRACA: ${{ runner.temp }}\mentor-praca
        run: |
          pip install pytest==9.2.0
          python -m pytest testy -q -p no:cacheprovider --durations=10
      - name: PyInstaller
        run: pyinstaller --clean --noconfirm mentor.spec
      - name: Test uruchomienia exe (smoke)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist\Mentor.exe" -PassThru
          Start-Sleep -Seconds 8
          if ($p.HasExited) { Write-Error "Mentor.exe zakonczyl sie z kodem $($p.ExitCode)"; exit 1 }
          Stop-Process -Id $p.Id -Force
          Write-Host "Mentor.exe uruchamia sie poprawnie"
      - name: Spakuj
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path pakiet\Mentor | Out-Null
          Copy-Item dist\Mentor.exe pakiet\Mentor\
          Copy-Item README.md pakiet\Mentor\
          Copy-Item -Recurse programy pakiet\Mentor\programy
          Get-ChildItem -Recurse -Directory -Filter __pycache__ pakiet\Mentor\programy | Remove-Item -Recurse -Force -ErrorAction SilentlyContinue
          # pliki startowe kursu w korzeniu paczki (STANDARD_KURSOW §5–6): START_TUTAJ, skrypty .bat, kurs_mentor.json, manifest.json
          $mat = "programy\materialy\kadry-i-place"
          foreach ($f in @("START_TUTAJ.md", "SPRAWDZ_SRODOWISKO.bat", "INSTALACJA.bat", "URUCHOM_KURS.bat", "kurs_mentor.json", "manifest.json")) { Copy-Item "$mat\$f" pakiet\Mentor\ }
          Compress-Archive -Path pakiet\Mentor -DestinationPath Mentor-windows.zip
          # osobna paczka samego kursu (do importu w innym Mentorze / do czytania offline)
          New-Item -ItemType Directory -Path pakiet\kurs | Out-Null
          Copy-Item -Recurse $mat pakiet\kurs\Kadry-i-place
          Compress-Archive -Path pakiet\kurs\Kadry-i-place -DestinationPath Kadry-i-place-kurs.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Mentor-windows
          path: |
            dist/Mentor.exe
            Mentor-windows.zip
            Kadry-i-place-kurs.zip
      - name: Release (najnowsza wersja)
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'latest' }}
          name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'Mentor — najnowsza wersja' }}
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/v') }}
          body: |
            **Mentor.exe** — interaktywny nauczyciel (Windows 10/11, 64-bit, bez instalacji).

            Pobierz **`Mentor-windows.zip`** (zalecane: exe + README + programy + paczka materiałów kursu kadrowego: START_TUTAJ.md, SPRAWDZ_SRODOWISKO.bat, INSTALACJA.bat, URUCHOM_KURS.bat, ćwiczenia, rozwiązania, pomoc)
            albo `Mentor.exe` (sam program; przy pierwszym uruchomieniu rozpakuje wbudowane programy i materiały do folderu `programy/` obok siebie).
            `Kadry-i-place-kurs.zip` — sam kurs (kurs_mentor.json + materiały) do wgrania w innym Mentorze lub do czytania offline.

            Windows SmartScreen może ostrzec przy pierwszym uruchomieniu (plik bez podpisu): „Więcej informacji” → „Uruchom mimo to”.

            **Nowe (2.7):** zakładka **Środowisko** — Mentor sam sprawdza i instaluje Pythona, biblioteki i środowisko kursu (bez terminala, bez
            uprawnień administratora, za Twoją zgodą), **Importuj kurs ZIP…** w Ustawieniach (podgląd, bezpieczne rozpakowanie, stare paczki v1.1 bez
            uruchamiania skryptów), ćwiczenia uruchamiane i sprawdzane **w Mentorze**. Dane (postępy, kursy, środowiska) są w `%LOCALAPPDATA%\Mentor\`;
            stary `mentor_dane.json` obok exe przenosi się sam (z kopią). `portable.txt` obok exe = tryb przenośny.
          files: |
            dist/Mentor.exe
            Mentor-windows.zip
            Kadry-i-place-kurs.zip
